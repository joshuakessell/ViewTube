<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0908" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ViewTube" />
    <!-- YouTube's embedded player refuses to play without a referrer. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>ViewTube</title>
    <meta name="description" content="Watch YouTube together, face to face. Paste a link and it plays for both of you, with your video call alongside." />
    <!-- What an invite link looks like when it is sent in a message. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ViewTube" />
    <meta property="og:title" content="Watch with me on ViewTube" />
    <meta property="og:description" content="Tap to join. We watch YouTube together, face to face." />
    <meta property="og:image" content="https://joshuakessell.github.io/ViewTube/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
